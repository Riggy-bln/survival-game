<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Handy: volle Breite, kein Zoomen durch Tippen oder Ziehen -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BrokRun">
    <meta name="theme-color" content="#111111">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <title>BrokRun</title>
    <style>
        /* Schwarzer Hintergrund, Spiel mittig, kein Scrollen */
        html, body { margin: 0; background: #111; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; overflow: hidden; }
        canvas { touch-action: none; }
        /* Hochkant am Handy: Bitte drehen */
        #drehen { display: none; position: fixed; inset: 0; z-index: 9000; background: #111; color: #e0e6ea; font: 22px sans-serif;
                  align-items: center; justify-content: center; text-align: center; padding: 24px; }
        @media (orientation: portrait) and (pointer: coarse) { #drehen { display: flex; } }
    </style>
</head>
<body>
    <div id="drehen">Please rotate your phone to landscape<br>so the game fits.</div>
    <!-- 0. Fehlerbox: Zeigt JavaScript-Fehler rot direkt im Browserfenster an (ohne Konsole) -->
    <script>
        window.zeigeFehler = function (text) {
            var box = document.getElementById('fehlerbox');
            if (!box) {
                box = document.createElement('pre');
                box.id = 'fehlerbox';
                box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:40vh;overflow:auto;margin:0;' +
                    'padding:8px;background:#600;color:#fff;font:12px monospace;z-index:9999;white-space:pre-wrap';
                document.body.appendChild(box);
            }
            box.textContent += text + '\n';
        };
        window.addEventListener('error', function (e) {
            window.zeigeFehler('FEHLER: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')');
        });
        window.addEventListener('unhandledrejection', function (e) {
            window.zeigeFehler('FEHLER (Promise): ' + e.reason);
        });
    </script>
    <!-- 1. Zuerst die Phaser-Bibliothek laden (stellt das globale Objekt "Phaser" bereit) -->
    <script src="libs/phaser.min.js"></script>
    <!-- 1b. PeerJS: verbindet Browser direkt miteinander (für den Online-Mehrspielermodus), stellt das globale Objekt "Peer" bereit -->
    <script src="libs/peerjs.min.js"></script>
    <!-- 2. Dann unser eigener Code. type="module" erlaubt uns, Code auf mehrere Dateien aufzuteilen -->
    <!--IMPORTMAP-START-->
    <script>
        // Versionsnummer an alle Spieldateien hängen (erzeugt von version.py): So gibt es nach einer Veröffentlichung keine alten Dateien mehr.
        (function () {
            var VER = '51290c9-231621';
            var dateien = [
        'src/Anpassung.js',
        'src/Effects.js',
        'src/Landscape.js',
        'src/Mehrspieler.js',
        'src/MenuStil.js',
        'src/Netz.js',
        'src/Sound.js',
        'src/Stufen.js',
        'src/Touch.js',
        'src/entities/Boss.js',
        'src/entities/Brut.js',
        'src/entities/Bullet.js',
        'src/entities/Enemy.js',
        'src/entities/Fass.js',
        'src/entities/Grenade.js',
        'src/entities/Pickup.js',
        'src/entities/Player.js',
        'src/entities/RangedEnemy.js',
        'src/entities/Skelett.js',
        'src/levels/Level01.js',
        'src/main.js',
        'src/scenes/GameScene.js',
        'src/scenes/LobbyScene.js',
        'src/scenes/MenuScene.js',
        'src/scenes/PauseScene.js'
            ];
            var imports = {};
            dateien.forEach(function (d) { var u = new URL(d, document.baseURI).href; imports[u] = u + '?v=' + VER; });
            var s = document.createElement('script');
            s.type = 'importmap';
            s.textContent = JSON.stringify({ imports: imports });
            document.head.appendChild(s);
            window.SPIEL_VERSION = VER;
        })();
    </script>
    <!--IMPORTMAP-END-->
    <script type="module" src="src/main.js?v=51290c9-231621"></script>
</body>
</html>
